title: 我的博客
subtitle: 记录学习，分享生活
description: 用文字记录技术探索与日常思考。
keywords:
author: joe419476-cell
language: zh-CN
timezone: Asia/Shanghai

# 工作流也会根据 GitHub Pages 设置自动覆盖构建地址。
url: https://joe419476-cell.github.io/
root: /
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
auto_spacing: false
titlecase: false
external_link:
  enable: true
  field: site
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
prismjs:
  preprocess: true
  line_number: true

index_generator:
  path: ''
  per_page: 10
  order_by: -date
default_category: 随笔
date_format: YYYY-MM-DD
time_format: HH:mm:ss
per_page: 10
pagination_dir: page
theme: butterfly
deploy:
  type: ''
