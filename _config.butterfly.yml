nav:
  display_title: true
  display_post_title: true
  fixed: true
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-box-archive
  关于: /about/ || fas fa-user-astronaut
  GitHub: https://github.com/joe419476-cell || fab fa-github
social:
  fab fa-github: https://github.com/joe419476-cell || GitHub
favicon: /img/avatar.svg
avatar:
  img: /img/avatar.svg
  effect: false
index_img: /img/orbit.svg
default_top_img: /img/orbit.svg
archive_img: /img/orbit.svg
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/orbit.svg
index_layout: 1
index_post_content:
  method: 2
  length: 160
subtitle:
  enable: true
  effect: false
  source: false
